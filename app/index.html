<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Get Swapaya</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<!--
  swapaya.com/app — one link for bios, captions and QR codes.
  iPhone -> App Store, Android -> Google Play, anything else -> the homepage.
  Tag the source: swapaya.com/app?s=tiktok (?s=instagram, ?s=linkedin, ?s=qr ...).
  Google Play reports it under Acquisition -> UTM-tagged traffic.
  App Store campaign links need a provider token: paste it into APPLE_PT
  (App Store Connect -> App Analytics -> Campaigns; pt= is in the generated link).
-->
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#FAF4E8;color:#2E2A24;
       font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;text-align:center;padding:0 16px}
  a{color:#3A6B4F;font-weight:700}
  @media (prefers-color-scheme:dark){body{background:#141E18;color:#F2EFE7}a{color:#7FBF9A}}
</style>
</head>
<body>
<p>Taking you to Swapaya…<br />
  <a id="ios" href="https://apps.apple.com/gb/app/swapaya/id6796486365">iPhone</a> ·
  <a id="android" href="https://play.google.com/store/apps/details?id=com.swapaya.app">Android</a>
</p>
<script>
(function(){
  var APPLE_PT = '';
  var APP  = 'https://apps.apple.com/gb/app/swapaya/id6796486365';
  var PLAY = 'https://play.google.com/store/apps/details?id=com.swapaya.app';
  var q = new URLSearchParams(location.search);
  var clean = function(v, d){ return (v || d).toLowerCase().replace(/[^a-z0-9_-]/g, '').slice(0, 40) || d; };
  var src = clean(q.get('s') || q.get('utm_source'), 'site');
  var camp = clean(q.get('c') || q.get('utm_campaign'), 'app_link');
  var play = PLAY + '&utm_source=' + src + '&utm_campaign=' + camp
           + '&referrer=' + encodeURIComponent('utm_source=' + src + '&utm_campaign=' + camp);
  var app = APPLE_PT ? APP + '?pt=' + APPLE_PT + '&ct=' + src + '&mt=8' : APP;
  document.getElementById('ios').href = app;
  document.getElementById('android').href = play;
  var ua = navigator.userAgent || '';
  var ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  location.replace(ios ? app : /Android/.test(ua) ? play : '/#get');
})();
</script>
</body>
</html>
